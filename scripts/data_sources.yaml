    description: >-
      gnomAD v4.1 exomes sites VCFs (Broad, per chromosome, about 300 GB in total) for VEP's
      gnomAD_exomes custom annotation in BIAS-2015's VEP mode. BIAS reads AC, AN and AF from it
      (population frequencies come from the VEP cache); the v4.1 exomes VCF has no AF_joint, which
      BIAS's documented field list names, so that field stays empty. The prepare step keeps only the
