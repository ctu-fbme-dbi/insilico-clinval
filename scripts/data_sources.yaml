  bias2015_erepo_benchmark_v2.2.0:
    description: >-
      The variants of the ClinGen eRepo V2.2.0 snapshot (accessed 2025-02-02) on which BIAS-2015
      v2.1.1 was benchmarked: Additional file 2 of Eisenhart et al. 2025, Genome Med 17:148
      (8,707 records, hg19, positions and alleles only), lifted to GRCh38 with CrossMap and the
      UCSC hg19ToHg38 chain. The held-out reference of the article (`clinval held-out
      --reference clingen/bias2015_erepo_v2.2.0_benchmark.grch38.vcf`); needs grch38.
