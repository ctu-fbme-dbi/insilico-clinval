      - url: https://static-content.springer.com/esm/art%3A10.1186%2Fs13073-025-01581-y/MediaObjects/13073_2025_1581_MOESM2_ESM.vcf
        path: clingen/bias2015_erepo_v2.2.0_benchmark.hg19.vcf
        sha256: 95cc0931f9ce419ff4f37f289dc03310603b76be0eb04ffebb4b8ae5472edf04  # downloaded 2026-10-25
      - url: https://hgdownload.soe.ucsc.edu/goldenPath/hg19/liftOver/hg19ToHg38.over.chain.gz
        path: liftover/hg19ToHg38.over.chain.gz
        sha256: 5c0598e500ceb5a78c73086929e8ef993aec309bcafb595139b53d440b125a1d  # downloaded 2026-10-25
    prepare:
      - action: run
        argv: [docker, run, --rm, --user, "{uid}:{gid}", -v, "{data_dir}:{data_dir}",
