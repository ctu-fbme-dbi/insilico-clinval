  nirvana_grch38:
    description: >-
      Nirvana 3.18.1 GRCh38 annotation data (Cache, References, SupplementaryAnnotation) via
      Illumina's Downloader in the clinval-nirvana image (build it first), then Bitscopic's
      updated ClinVar (2026-02) and AlphaMissense files replacing the stale ClinVar 2023-09-30
      bundled with Nirvana, as the BIAS-2015 README instructs. Large download.
    prepare:
      - action: run   # the Downloader needs an existing output directory
        argv: [mkdir, -p, "{data_dir}/nirvana/GRCh38"]
      - action: run
        argv: [docker, run, --rm, --user, "{uid}:{gid}", -v, "{data_dir}:{data_dir}",
               "clinval-nirvana:3.18.1", nirvana_downloader, --ga, GRCh38,
               --out, "{data_dir}/nirvana/GRCh38"]
        creates: nirvana/GRCh38/References/Homo_sapiens.GRCh38.Nirvana.dat
      # Keep only Bitscopic's ClinVar 2026-02 (nirvana_grch38_updates). The BIAS README names
      # ClinVar_20230930; Illumina's manifest now ships 20231230 and a 20240301 preview instead.
      - action: remove
        paths:
          - nirvana/GRCh38/SupplementaryAnnotation/GRCh38/ClinVar_20230930.nsa
          - nirvana/GRCh38/SupplementaryAnnotation/GRCh38/ClinVar_20230930.nsa.idx
          - nirvana/GRCh38/SupplementaryAnnotation/GRCh38/ClinVar_20230930.nsi
          - nirvana/GRCh38/SupplementaryAnnotation/GRCh38/ClinVar_20231230.nsa
          - nirvana/GRCh38/SupplementaryAnnotation/GRCh38/ClinVar_20231230.nsa.idx
          - nirvana/GRCh38/SupplementaryAnnotation/GRCh38/ClinVar_20231230.nsi
          - nirvana/GRCh38/SupplementaryAnnotation/GRCh38/ClinVar_preview_20240301.nsa
          - nirvana/GRCh38/SupplementaryAnnotation/GRCh38/ClinVar_preview_20240301.nsa.idx
          - nirvana/GRCh38/SupplementaryAnnotation/GRCh38/ClinVar_preview_20240301.nsi

