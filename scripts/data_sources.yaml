  clingen_erepo_bias_validation:
    description: >-
      eRepo export used to validate BIAS-2015 (bitscopic/BIAS-2015-data v1.0.0,
      validation_data/erepo.tabbed.txt; 7632 classifications approved 2015-12-16..2024-08-02).
      This is the benchmark of the earlier BIAS-2015 paper (eRepo v1.0.29, Eisenhart et al. 2024),
      not the V2.2.0 one; see bias2015_erepo_benchmark_v2.2.0.
    files:
