               CrossMap, vcf, "{data_dir}/liftover/hg19ToHg38.over.chain.gz",
               "{data_dir}/clingen/bias2015_erepo_v2.2.0_benchmark.hg19.vcf",
               "{data_dir}/reference/GRCh38_no_alt_analysis_set.fa",
               "{data_dir}/clingen/bias2015_erepo_v2.2.0_benchmark.grch38.vcf"]
        creates: clingen/bias2015_erepo_v2.2.0_benchmark.grch38.vcf

  clingen_erepo_v2.2.0:
    description: >-
      ClinGen eRepo export of the release BIAS-2015 was tuned on (V2.2.0). Not published; the
      variants are available as bias2015_erepo_benchmark_v2.2.0 (used instead).
    manual: >-
      Obtain the eRepo v2.2.0 export used by the BIAS-2015 authors (e.g. from their
      publication's supplementary data or by request) and save it as
      clingen/erepo_v2.2.0.tsv; it needs a Uuid or Allele Registry Id column.
