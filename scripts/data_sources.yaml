  grch38_giab_v3_masked:
    description: >-
      GIAB GRCh38 v3 no-alt analysis set with the false (incorrect) copies of the GRCh38 false
      duplications masked (rescuing e.g. CBS, CRYAA, KCNE1, U2AF1 on chr21, MAP2K3, KMT2C,
      KCNJ18) and decoys; the reference v5.0q was built on (v5.0q/defrabb_files/resources.yml).
      Simulation reference of the revision suites; the pipeline keeps its own
      reference. The prepare step checks that the primary contigs equal the no-alt analysis set
      (dataset grch38, fetch it first) and writes the bases masked only here (10 intervals,
      1.04 Mb on 2026-10-25, equal to GIAB's false_duplications_incorrect_copy up to a few bp).
    files:
      - url: https://giab-data.s3.amazonaws.com/giab-test-data/GRCh38_GIABv3_no_alt_analysis_set_maskedGRC_decoys_MAP2K3_KMT2C_KCNJ18.fasta.gz
        path: reference/GRCh38_GIABv3_no_alt_analysis_set_maskedGRC_decoys_MAP2K3_KMT2C_KCNJ18.fasta.gz
        sha256: b37cb9a9c0f8716fdb13e2c5c60f08cb8be40de39c3088176f1f62d9e8eeeed8  # first download 2026-10-25 (GIAB publishes no checksum; MD5 939ce190…)
    prepare:
      - action: decompress_fasta
        source: reference/GRCh38_GIABv3_no_alt_analysis_set_maskedGRC_decoys_MAP2K3_KMT2C_KCNJ18.fasta.gz
        target: reference/GRCh38_GIABv3_masked.fa
      - action: run
        argv: [clinval, check-references, --reference, "{data_dir}/reference/GRCh38_GIABv3_masked.fa",
               --against, "{data_dir}/reference/GRCh38_no_alt_analysis_set.fa",
               --masked-bed, "{data_dir}/strata/GRCh38_GIABv3_masked_false_dup.bed"]
        creates: strata/GRCh38_GIABv3_masked_false_dup.bed

