# Reference data fetched by scripts/fetch_data.py (never committed; downloads are explicit, checksummed steps).
# `path` is relative to the data directory (default: ./data). `sha256: null` marks a file that is
# not pinned (a moving export such as the ClinGen eRepo); it is fetched only with
# --allow-unpinned and its hash is recorded in data/fetch_report.json and in every run manifest.
schema_version: 1
datasets:
  grch38:
    description: >-
      GRCh38 no-alt analysis set (UCSC-style names, chrY PARs and centromeric arrays masked),
      the reference recommended for short-read pipelines; NCBI GCA_000001405.15.
    files:
      - url: https://ftp.ncbi.nlm.nih.gov/genomes/all/GCA/000/001/405/GCA_000001405.15_GRCh38/seqs_for_alignment_pipelines.ucsc_ids/GCA_000001405.15_GRCh38_no_alt_analysis_set.fna.gz
        path: reference/GCA_000001405.15_GRCh38_no_alt_analysis_set.fna.gz
        sha256: fb4243ebb014caf27111f24dd62b7ce42160f28581da6f8fcd6cba5977778d02  # MD5 a08035b6… matches NCBI md5checksums.txt
    prepare:
      - action: decompress_fasta
        source: reference/GCA_000001405.15_GRCh38_no_alt_analysis_set.fna.gz
        target: reference/GRCh38_no_alt_analysis_set.fa

