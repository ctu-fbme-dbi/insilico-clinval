    category: curated
    source: clingen_erepo
    classification_allow: [pathogenic, likely_pathogenic]
    genes: [PTEN, TNNT2]
    conditions:
      - MONDO:0021056   # familial adenomatous polyposis 1 (APC)
      - MONDO:0021057   # classic or attenuated FAP (APC)
      - MONDO:0021055   # classic FAP (APC)
