background:
  name: GIAB_HG002
  vcf: ../../data/giab/HG002_GRCh38_1_22_v4.2.1_benchmark.vcf.gz
  bed: ../../data/giab/HG002_GRCh38_1_22_v4.2.1_benchmark_noinconsistent.bed
  release: "v4.2.1"
  sex: male

samples:
  - { sample_id: positive, role: positive, sex: male }
  - { sample_id: negative, role: negative, sex: male }

