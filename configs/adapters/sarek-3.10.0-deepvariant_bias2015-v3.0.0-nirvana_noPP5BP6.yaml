# System under test: nf-core/sarek 3.10.0 (bwa-mem2, DeepVariant, BQSR skipped, iGenomes
# GATK.GRCh38; the configuration of the article's Sarek runs) -> BIAS-2015 v3.0.0 with
# Nirvana 3.18.1. PP5/BP6 (ClinVar evidence) switched off, to
# measure how much of the performance comes from database lookup.
# Data: python scripts/fetch_data.py --only bias2015_hg38,nirvana_grch38,nirvana_grch38_updates
schema_version: 1
name: sarek-3.10.0-deepvariant_bias2015-v3.0.0-nirvana_noPP5BP6
description: "sarek 3.10.0 (DeepVariant) + BIAS-2015 v3.0.0 (Nirvana 3.18.1), PP5/BP6 off"

secondary:
  adapter: sarek
  sarek:
    release: "3.10.0"
    profile: docker
    tools: [deepvariant, snpeff, vep, merge]
    skip_tools: [baserecalibrator]
    variant_caller: deepvariant
    reference: { genome: GATK.GRCh38 }
    params: { aligner: bwa-mem2, trim_fastq: true, save_mapped: true }
    save_reference: false
    # resource_limits: { cpus: 8, memory: "16.GB", time: "48.h" }

tertiary:
  adapter: bias2015
  input: filtered            # DeepVariant writes no separate filtered VCF: the raw VCF is used
  pass_only: true            # drops DeepVariant RefCall/LowQual records
  # regions_bed: ../regions/reportable_genes.bed
  report_classifications: [pathogenic, likely_pathogenic]
  bias2015:
    version: v3.0.0
    data_dir: ../../data/bias2015/hg38_2026.03.01
    data_release: "2026.03.01"
    annotator: nirvana
    nirvana:
      cache: ../../data/nirvana/GRCh38/Cache/GRCh38/Both
      supplementary: ../../data/nirvana/GRCh38/SupplementaryAnnotation/GRCh38
      reference: ../../data/nirvana/GRCh38/References/Homo_sapiens.GRCh38.Nirvana.dat
    skip_codes: [PP5, BP6]
